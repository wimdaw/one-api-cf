name: Deploy to Cloudflare Workers

on:
  workflow_dispatch: # 允许手动触发
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Worker (auto D1 + Analytics)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Create/Get D1 database
        id: d1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          # 查询已有同名 D1 数据库;没有则创建
          EXISTING=$(curl -s -X GET \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database?per_page=50" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" | \
            python3 -c "import sys,json;d=json.load(sys.stdin);print(next((r['uuid'] for r in d.get('result',[]) if r.get('name')=='one-api-cf'),''))")
          if [ -n "$EXISTING" ]; then
            echo "d1_id=$EXISTING" >> $GITHUB_OUTPUT
            echo "✅ D1 已存在: $EXISTING"
          else
            CREATED=$(curl -s -X POST \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              -d '{"name":"one-api-cf"}' | \
              python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('result',{}).get('uuid',''))")
            if [ -z "$CREATED" ]; then
              echo "❌ 创建 D1 失败"; exit 1
            fi
            echo "d1_id=$CREATED" >> $GITHUB_OUTPUT
            echo "✅ D1 已创建: $CREATED"
          fi

      - name: Configure wrangler.jsonc with real IDs
        env:
          D1_ID: ${{ steps.d1.outputs.d1_id }}
        run: |
          python3 << 'EOF'
          import json, re, os

          d1_id = os.environ['D1_ID'].strip()

          with open('wrangler.jsonc', 'r', encoding='utf-8') as f:
              content = f.read()

          # 去掉 JSONC 注释(简单处理 // 行注释)
          content_no_comments = re.sub(r'^\s*//.*$', '', content, flags=re.M)

          cfg = json.loads(content_no_comments)
          cfg['d1_databases'] = [{
              'binding': 'DB',
              'database_name': 'one-api-cf',
              'database_id': d1_id,
          }]
          # 分析数据直接使用 D1 的 usage_record 表, 无需 Analytics Engine
          cfg.pop('analytics_engine_datasets', None)
          cfg['compatibility_date'] = cfg.get('compatibility_date', '2025-04-28')

          with open('wrangler.jsonc', 'w', encoding='utf-8') as f:
              json.dump(cfg, f, indent=2)
          print("OK wrangler.jsonc updated: D1=" + d1_id[:8] + "...")
          EOF

      - name: Build
        run: bun run build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          secrets: |
            ADMIN_TOKEN
          command: deploy
